<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" preserveAspectRatio="none" role="img" aria-label="Water's edge">
  <defs>
<linearGradient id="tide-sand" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0"    stop-color="var(--surface-2)"/>
  <stop offset="0.45" stop-color="var(--scene-sand-top)"/>
  <stop offset="1"    stop-color="var(--scene-sand-wet)"/>
</linearGradient>
<linearGradient id="tide-water" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0"    stop-color="var(--scene-sea-shallow)"/>
  <stop offset="0.42" stop-color="var(--scene-water-1)"/>
  <stop offset="1"    stop-color="var(--scene-water-3)"/>
</linearGradient>
<path id="tide-leaf" d="M 0 0 Q 26 -6 50 -2 Q 26 6 0 0 Z"/>
  </defs>

  <!-- ===== DRY SAND ===== -->
  <rect y="0" width="1440" height="230" fill="url(#tide-sand)"/>

  <!-- Sand grain texture -->
  <g fill="var(--scene-sand-dark)" opacity="0.20">
<circle cx="70"   cy="52"  r="2"/><circle cx="238" cy="96"  r="1.6"/>
<circle cx="402"  cy="40"  r="2.2"/><circle cx="560" cy="112" r="1.5"/>
<circle cx="742"  cy="62"  r="2"/><circle cx="905"  cy="128" r="1.7"/>
<circle cx="1064" cy="48"  r="2.1"/><circle cx="1228" cy="104" r="1.6"/>
<circle cx="1362" cy="70"  r="2"/><circle cx="150"  cy="150" r="1.5"/>
<circle cx="640"  cy="160" r="1.8"/><circle cx="1150" cy="158" r="1.6"/>
  </g>

  <!-- ===== PALM FROND SHADOWS — the overhead cue ===== -->
  <g class="tide-shadow" fill="var(--scene-sand-dark)" opacity="0.20" transform="translate(-30,-16)">
<use href="#tide-leaf" transform="translate(30,14) rotate(-34)"/>
  <use href="#tide-leaf" transform="translate(26,18) rotate(34)"/>
  <use href="#tide-leaf" transform="translate(58,30) rotate(-27)"/>
  <use href="#tide-leaf" transform="translate(54,34) rotate(41)"/>
  <use href="#tide-leaf" transform="translate(88,48) rotate(-20)"/>
  <use href="#tide-leaf" transform="translate(84,52) rotate(48)"/>
  <use href="#tide-leaf" transform="translate(120,68) rotate(-13)"/>
  <use href="#tide-leaf" transform="translate(116,72) rotate(55)"/>
  <use href="#tide-leaf" transform="translate(152,90) rotate(-6)"/>
  <use href="#tide-leaf" transform="translate(148,94) rotate(62)"/>
  <use href="#tide-leaf" transform="translate(182,113) rotate(1)"/>
  <use href="#tide-leaf" transform="translate(178,117) rotate(69)"/>
  <use href="#tide-leaf" transform="translate(210,137) rotate(8)"/>
  <use href="#tide-leaf" transform="translate(206,141) rotate(76)"/>
  </g>
  <g class="tide-shadow tide-shadow--right" fill="var(--scene-sand-dark)" opacity="0.16"
 transform="translate(1470,-10) scale(-1,1)">
<use href="#tide-leaf" transform="translate(30,14) rotate(-34)"/>
  <use href="#tide-leaf" transform="translate(26,18) rotate(34)"/>
  <use href="#tide-leaf" transform="translate(58,30) rotate(-27)"/>
  <use href="#tide-leaf" transform="translate(54,34) rotate(41)"/>
  <use href="#tide-leaf" transform="translate(88,48) rotate(-20)"/>
  <use href="#tide-leaf" transform="translate(84,52) rotate(48)"/>
  <use href="#tide-leaf" transform="translate(120,68) rotate(-13)"/>
  <use href="#tide-leaf" transform="translate(116,72) rotate(55)"/>
  <use href="#tide-leaf" transform="translate(152,90) rotate(-6)"/>
  <use href="#tide-leaf" transform="translate(148,94) rotate(62)"/>
  <use href="#tide-leaf" transform="translate(182,113) rotate(1)"/>
  <use href="#tide-leaf" transform="translate(178,117) rotate(69)"/>
  <use href="#tide-leaf" transform="translate(210,137) rotate(8)"/>
  <use href="#tide-leaf" transform="translate(206,141) rotate(76)"/>
  </g>

  <!-- ===== THINGS ON THE SAND (drawn from above) ===== -->
  <g class="tide-items">
<!-- Starfish -->
<g transform="translate(214,120) rotate(-18)">
  <path fill="#E68A2E" stroke="#3D2817" stroke-width="2.4" stroke-linejoin="round"
        d="M 0 -30 L 8 -10 L 31 -6 L 14 6 L 20 30 L 0 17 L -20 30 L -14 6 L -31 -6 L -8 -10 Z"/>
  <path fill="#F5B876" opacity="0.85" d="M 0 -25 L 5 -11 L 17 -6 L -5 -5 L -17 -6 L -5 -11 Z"/>
  <g fill="#B96A1A"><circle cx="0" cy="0" r="2"/><circle cx="6" cy="8" r="1.3"/><circle cx="-6" cy="8" r="1.3"/></g>
</g>
<!-- Scallop shell -->
<g transform="translate(556,86) rotate(14)">
  <path fill="#F5D0BE" stroke="#3D2817" stroke-width="2.2" stroke-linejoin="round"
        d="M -30 17 Q -23 -23 0 -23 Q 23 -23 30 17 Q 23 22 0 22 Q -23 22 -30 17 Z"/>
  <path fill="#FFEDDF" opacity="0.8" d="M -23 9 Q -17 -16 0 -16 Q -6 -10 -10 0 Q -16 9 -23 9 Z"/>
  <g fill="none" stroke="#B96A1A" stroke-width="1.6" stroke-linecap="round">
    <path d="M -14 -7 L -6 16"/><path d="M -6 -16 L -1 17"/>
    <path d="M 6 -16 L 1 17"/><path d="M 14 -7 L 6 16"/>
  </g>
  <circle cx="0" cy="-21" r="2.2" fill="#3D2817"/>
</g>
<!-- Little crab -->
<g transform="translate(1042,140) scale(0.62)">
  <g stroke="#3D2817" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M -20 5 L -32 20"/><path d="M -10 8 L -14 26"/>
    <path d="M 10 8 L 14 26"/><path d="M 20 5 L 32 20"/>
  </g>
  <ellipse cx="0" cy="0" rx="24" ry="16" fill="#EA4335" stroke="#3D2817" stroke-width="3"/>
  <ellipse cx="-6" cy="-6" rx="14" ry="8" fill="#F58179" opacity="0.85"/>
  <circle cx="-8" cy="-19" r="4" fill="#FDF6E4" stroke="#3D2817" stroke-width="2"/>
  <circle cx="8"  cy="-19" r="4" fill="#FDF6E4" stroke="#3D2817" stroke-width="2"/>
  <circle cx="-8" cy="-19" r="1.7" fill="#3D2817"/><circle cx="8" cy="-19" r="1.7" fill="#3D2817"/>
  <path fill="#EA4335" stroke="#3D2817" stroke-width="2.5" stroke-linejoin="round"
        d="M -26 0 L -38 -8 L -34 0 L -38 8 L -26 5 Z"/>
  <path fill="#EA4335" stroke="#3D2817" stroke-width="2.5" stroke-linejoin="round"
        d="M 26 0 L 38 -8 L 34 0 L 38 8 L 26 5 Z"/>
</g>
<!-- Small shell -->
<g transform="translate(1268,74) rotate(-22) scale(0.6)">
  <path fill="#F4B8A0" stroke="#3D2817" stroke-width="3" stroke-linejoin="round"
        d="M -26 15 Q -20 -20 0 -20 Q 20 -20 26 15 Q 20 19 0 19 Q -20 19 -26 15 Z"/>
  <g fill="none" stroke="#B96A1A" stroke-width="2.4" stroke-linecap="round">
    <path d="M -11 -6 L -5 14"/><path d="M 0 -14 L 0 15"/><path d="M 11 -6 L 5 14"/>
  </g>
</g>
<!-- Pebbles -->
<g fill="var(--scene-sand-dark)" opacity="0.42">
  <ellipse cx="352"  cy="168" rx="7"   ry="4.5"/>
  <ellipse cx="820"  cy="182" rx="5.5" ry="3.6"/>
  <ellipse cx="1180" cy="176" rx="6.5" ry="4"/>
</g>
  </g>

  <!-- ===== SHALLOW WATER ===== -->
  <rect y="210" width="1440" height="210" fill="url(#tide-water)"/>

  <!-- Caustics — light bending on the sandy bottom -->
  <g class="tide-caustics" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.4">
<path d="M 90 356 Q 160 342 232 356 T 372 356"/>
<path d="M 470 380 Q 540 366 612 380 T 752 380"/>
<path d="M 860 352 Q 930 338 1002 352 T 1142 352"/>
<path d="M 1210 384 Q 1275 372 1342 384"/>
  </g>
  <g class="tide-caustics tide-caustics--b" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.3">
<path d="M 200 404 Q 268 394 338 404"/>
<path d="M 640 340 Q 706 330 774 340"/>
<path d="M 1040 406 Q 1108 396 1178 406"/>
  </g>

  <!-- ===== FOAM BANDS drifting along the tide line ===== -->
  <g class="tide-foam tide-foam--c" fill="#FFFFFF" opacity="0.34">
<path d="M -300 302 Q -240 291 -180 302 T -60 302 T 60 302 T 180 302 T 300 302 T 420 302 T 540 302 T 660 302 T 780 302 T 900 302 T 1020 302 T 1140 302 T 1260 302 T 1380 302 T 1500 302 T 1620 302 T 1740 302 L 1740 328 L -300 328 Z"/>
  </g>
  <g class="tide-foam tide-foam--b" fill="#FFFFFF" opacity="0.58">
<path d="M -300 252 Q -240 236 -180 252 T -60 252 T 60 252 T 180 252 T 300 252 T 420 252 T 540 252 T 660 252 T 780 252 T 900 252 T 1020 252 T 1140 252 T 1260 252 T 1380 252 T 1500 252 T 1620 252 T 1740 252 L 1740 292 L -300 292 Z"/>
  </g>
  <g class="tide-foam tide-foam--a" fill="var(--scene-foam-hi)">
<path d="M -300 198 Q -240 176 -180 198 T -60 198 T 60 198 T 180 198 T 300 198 T 420 198 T 540 198 T 660 198 T 780 198 T 900 198 T 1020 198 T 1140 198 T 1260 198 T 1380 198 T 1500 198 T 1620 198 T 1740 198 L 1740 246 L -300 246 Z"/>
  </g>

  <!-- Wet-sand sparkles just above the waterline -->
  <g fill="#FFFFFF" opacity="0.85">
<circle class="tide-sparkle" cx="176"  cy="206" r="3"/>
<circle class="tide-sparkle" cx="466"  cy="200" r="2.4"/>
<circle class="tide-sparkle" cx="742"  cy="208" r="3.2"/>
<circle class="tide-sparkle" cx="1010" cy="202" r="2.6"/>
<circle class="tide-sparkle" cx="1306" cy="207" r="3"/>
  </g>
</svg>
